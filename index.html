<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Focus Oyl" />
  <meta name="description" content="Focus on your life. An ambient, local-first reminder layer." />
  <title>Focus Oyl</title>
  <link rel="manifest" href="manifest.webmanifest?v=39" />
  <link rel="apple-touch-icon" href="icons/icon-512.svg" />
  <link rel="stylesheet" href="styles.css?v=39" />
</head>
<body>
  <main class="app-shell" id="appShell">
    <section class="ambient" aria-label="Focus Oyl">
      <header class="topbar">
        <button class="brand-mark" id="brandButton" type="button" aria-label="Focus Oyl 狀態">
          <span class="status-dot" id="statusDot"></span>
          <span>Focus Oyl</span>
        </button>
        <button class="ghost-button" id="settingsButton" type="button">設定</button>
      </header>

      <section class="quiet-center">
        <p class="eyebrow" id="dateLine"></p>
        <h1 id="clockLine">--:--</h1>
        <p class="tagline">Focus on your life.</p>
      </section>

      <aside class="care-console" id="careConsole" aria-label="家人照護台">
        <article class="care-panel">
          <p class="card-label">Now</p>
          <h2 id="careNextTitle">跨裝置待命</h2>
          <p id="careNextDetail">手機負責提醒，電腦負責整理。資料只留在使用者授權的裝置上。</p>
          <div class="care-actions">
            <button class="secondary-action" id="careTimelineButton" type="button">時間軸</button>
            <button class="secondary-action" id="careImportButton" type="button">匯入</button>
            <button class="secondary-action" id="careSafetyButton" type="button">呼叫</button>
            <button class="primary-action" id="careConnectButton" type="button">連接裝置</button>
          </div>
        </article>

        <article class="care-panel">
          <p class="card-label">Devices</p>
          <div class="device-list" id="careDeviceList"></div>
        </article>

        <article class="care-panel">
          <p class="card-label">Handoff</p>
          <div class="handoff-code" id="careSyncCode">----</div>
          <p id="careSyncDetail">用備份檔或本機接續碼，把同一份提醒帶到其他裝置。</p>
        </article>
      </aside>

      <section class="one-tap-card" id="oneTapCard" hidden>
        <p class="card-label" id="oneTapLabel">第一次使用</p>
        <h2 id="oneTapTitle">按一下就好。</h2>
        <p id="oneTapDetail">之後我會在需要時提醒你，不用每天打開 app。</p>
        <button class="one-tap-button" id="oneTapButton" type="button">一鍵開始</button>
        <p class="one-tap-note" id="oneTapNote">權限問題可由家人協助開啟。</p>
      </section>

      <section class="signal-card" id="signalCard" hidden>
        <div>
          <p class="card-label" id="signalLabel">下一件事</p>
          <h2 id="signalTitle"></h2>
          <p id="signalDetail"></p>
        </div>
        <div class="signal-actions" id="signalActions">
          <button class="round-action" id="signalDone" type="button" aria-label="完成提醒">完成</button>
          <button class="signal-dismiss" id="signalDismiss" type="button" hidden>稍後</button>
        </div>
      </section>

      <section class="install-card" id="installCard" hidden>
        <div>
          <p class="card-label">iPhone</p>
          <h2>加入主畫面，體感更接近 app。</h2>
          <p>Safari 分享 → 加入主畫面。原生通知會在 iOS app 版接上。</p>
        </div>
        <button class="text-action" id="dismissInstall" type="button">知道了</button>
      </section>

      <div class="activity-pill" id="activityPill" aria-live="polite">
        <span class="pill-dot"></span>
        <span id="pillText">本地待命</span>
      </div>

      <nav class="dock" aria-label="主要操作">
        <button class="dock-button" id="importButton" type="button">匯入</button>
        <button class="dock-button" id="inboxButton" type="button">時間軸</button>
        <button class="dock-button" id="reminderButton" type="button">提醒</button>
      </nav>
    </section>
  </main>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="grabber"></div>
      <div class="sheet-content" id="sheetContent"></div>
    </section>
  </div>

  <script src="node_modules/tesseract.js/dist/tesseract.min.js"></script>
  <script src="native-bridge.js?v=39"></script>
  <script src="ocr-engine.js?v=39"></script>
  <script src="memory-core.js?v=39"></script>
  <script src="time-core.js?v=39"></script>
  <script src="app.js?v=39"></script>
</body>
</html>
